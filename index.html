<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کارواش آفرینش</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
    direction: rtl;
    background: #eef4f9;
    background-image:
      radial-gradient(circle at 100% 0%, #dbeafe 0%, transparent 42%),
      radial-gradient(circle at 0% 0%, #ccfbf1 0%, transparent 38%);
    background-attachment: fixed;
    color: #0f172a;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .hidden { display: none !important; }
  .muted { color: #64748b; }
  .small { font-size: 13px; }

  #app { max-width: 720px; margin: 0 auto; padding: 18px 16px 70px; }

  /* ---------- generic ---------- */
  .card {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 18px;
    box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 10px 30px -12px rgba(15,23,42,.15);
  }

  .center-screen { min-height: calc(100vh - 40px); display: grid; place-items: center; }
  .hero-card { padding: 40px 28px; text-align: center; max-width: 460px; width: 100%; }
  .hero-icon { font-size: 54px; line-height: 1; margin-bottom: 10px; }
  .hero-title { font-size: 28px; margin: 0 0 6px; letter-spacing: -.5px; }

  .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 28px; }
  .role-btn {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 26px 12px;
    border: 1.5px solid #e2e8f0; border-radius: 16px;
    background: #f8fafc; cursor: pointer;
    font-family: inherit; font-size: 16px; font-weight: 600; color: #0f172a;
    transition: all .18s ease;
  }
  .role-btn:hover {
    border-color: #0284c7; background: #f0f9ff;
    transform: translateY(-2px); box-shadow: 0 10px 22px -10px rgba(2,132,199,.55);
  }
  .role-emoji { font-size: 34px; }

  /* ---------- topbar ---------- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 18px;
  }
  .topbar h2 { margin: 0; font-size: 20px; }
  .topbar-title { display: flex; align-items: center; gap: 8px; }

  /* ---------- buttons ---------- */
  .btn {
    font-family: inherit; font-size: 15px; font-weight: 600;
    border-radius: 12px; padding: 10px 18px;
    border: 1px solid transparent; cursor: pointer;
    transition: all .15s ease;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-primary { background: #0284c7; color: #fff; }
  .btn-primary:hover { background: #0369a1; }
  .btn-ghost { background: #fff; border-color: #e2e8f0; color: #334155; }
  .btn-ghost:hover { background: #f8fafc; border-color: #cbd5e1; }
  .btn-sm { padding: 7px 14px; font-size: 13px; border-radius: 10px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .icon-btn {
    background: transparent; border: none; cursor: pointer;
    font-size: 17px; padding: 6px 8px; border-radius: 8px; color: #64748b;
    font-family: inherit; transition: background .15s;
  }
  .icon-btn:hover { background: #f1f5f9; }
  .icon-btn.danger:hover { background: #fee2e2; }

  /* ---------- lists ---------- */
  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin: 4px 0 14px;
  }
  .section-head h3 { margin: 0; font-size: 17px; }

  .list { display: flex; flex-direction: column; gap: 10px; }
  .list-item {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    width: 100%; text-align: right;
    background: #fff; border: 1px solid #e2e8f0; border-radius: 14px;
    padding: 14px 16px;
    font-family: inherit; font-size: 15px; color: #0f172a;
    transition: all .15s ease;
  }
  .list-item.clickable { cursor: pointer; }
  .list-item.clickable:hover {
    border-color: #7dd3fc; background: #f0f9ff;
    transform: translateY(-1px); box-shadow: 0 8px 18px -12px rgba(2,132,199,.7);
  }
  .item-title { font-weight: 600; }
  .chev { color: #94a3b8; font-size: 20px; line-height: 1; }
  .row-actions { display: flex; gap: 2px; }
  .price-tag { font-weight: 700; color: #0284c7; }

  .empty { text-align: center; padding: 40px 20px; color: #94a3b8; }

  /* ---------- manager menu ---------- */
  .hero-mini {
    display: flex; align-items: center; gap: 14px;
    background: linear-gradient(135deg, #0284c7, #0ea5e9);
    color: #fff; padding: 20px; border-radius: 18px; margin-bottom: 18px;
    box-shadow: 0 16px 32px -18px rgba(2,132,199,.9);
  }
  .hero-mini .hero-icon { font-size: 34px; margin: 0; }
  .hero-mini .muted { color: rgba(255,255,255,.78); }

  .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .menu-card {
    display: flex; flex-direction: column; align-items: flex-start; gap: 10px;
    padding: 20px; border-radius: 16px; border: 1px solid #e2e8f0;
    background: #fff; cursor: pointer; font-family: inherit;
    transition: all .15s ease; text-align: right;
  }
  .menu-card:hover {
    border-color: #7dd3fc; transform: translateY(-2px);
    box-shadow: 0 14px 26px -16px rgba(2,132,199,.8);
  }
  .menu-icon { font-size: 26px; }
  .menu-title { font-weight: 700; font-size: 15px; color: #0f172a; }
  .menu-sub { font-size: 13px; color: #64748b; }

  /* ---------- worker stats ---------- */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
  .stat {
    background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px;
    padding: 16px 8px; text-align: center;
  }
  .stat-val { font-weight: 700; font-size: 15px; color: #0284c7; }
  .stat-label { font-size: 12px; color: #64748b; margin-top: 4px; }

  /* ---------- factors ---------- */
  .factor-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 14px 16px; }
  .factor-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .badge {
    background: #e0f2fe; color: #0369a1; font-size: 12px; font-weight: 700;
    padding: 4px 10px; border-radius: 999px;
  }
  .factor-line { font-size: 14px; padding: 3px 0; }
  .factor-total {
    margin-top: 8px; padding-top: 8px; border-top: 1px dashed #e2e8f0;
    font-weight: 700; color: #0284c7; font-size: 15px;
  }

  /* ---------- cashier ---------- */
  .steps { display: flex; gap: 6px; margin-bottom: 18px; }
  .step-dot { flex: 1; height: 6px; border-radius: 99px; background: #e2e8f0; transition: background .2s; }
  .step-dot.active { background: #0284c7; }
  .step-dot.done { background: #7dd3fc; }

  .crumb { margin: -6px 0 14px; }

  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 18px; border-radius: 999px;
    border: 1.5px solid #e2e8f0; background: #fff;
    cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 600;
    color: #334155; transition: all .15s ease;
  }
  .chip:hover { border-color: #7dd3fc; }
  .chip.selected { background: #0284c7; border-color: #0284c7; color: #fff; }
  .chip-price { font-size: 12px; opacity: .8; }

  .tip-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 18px; padding: 10px 10px 10px 16px;
    background: #fff; border: 1px solid #e2e8f0; border-radius: 14px;
    font-weight: 600; font-size: 14px;
  }

  .summary {
    background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 14px;
    padding: 14px 18px; margin-top: 16px;
  }
  .summary-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
  .summary-row.total {
    border-top: 1px solid #e2e8f0; margin-top: 6px; padding-top: 12px;
    font-weight: 700; font-size: 17px; color: #0284c7;
  }

  .actions-row { display: flex; gap: 10px; margin-top: 18px; }
  .actions-row .btn { flex: 1; justify-content: center; }

  /* ---------- receipt ---------- */
  .receipt { padding: 26px 22px; }
  .success-icon { font-size: 46px; text-align: center; }
  .receipt-sub { text-align: center; color: #16a34a; font-weight: 600; margin: 8px 0 20px; }
  .receipt-row {
    display: flex; justify-content: space-between; padding: 10px 0;
    border-bottom: 1px dashed #e2e8f0; font-size: 14px;
  }
  .receipt-row span:first-child { color: #64748b; }
  .receipt-row.total {
    border-bottom: none; border-top: 2px solid #e2e8f0;
    margin-top: 6px; padding-top: 14px;
    font-weight: 700; color: #0284c7; font-size: 17px;
  }

  /* ---------- modal ---------- */
  .modal {
    position: fixed; inset: 0; background: rgba(15,23,42,.5);
    display: grid; place-items: center; z-index: 50; padding: 20px;
    backdrop-filter: blur(2px);
  }
  .modal-card {
    background: #fff; border-radius: 18px; padding: 24px;
    width: 100%; max-width: 400px;
    box-shadow: 0 30px 60px -20px rgba(15,23,42,.45);
    animation: pop .15s ease;
  }
  @keyframes pop { from { transform: scale(.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal-card h3 { margin: 0 0 12px; font-size: 17px; }
  .modal-card p { margin: 0 0 14px; line-height: 1.7; }
  .modal-card input {
    width: 100%; padding: 12px 14px; border-radius: 12px;
    border: 1.5px solid #e2e8f0; font-family: inherit; font-size: 15px;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .modal-card input:focus { border-color: #0284c7; box-shadow: 0 0 0 3px rgba(2,132,199,.13); }
  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .modal-actions .btn { flex: 1; justify-content: center; }

  /* ---------- toast ---------- */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 20px);
    background: #0f172a; color: #fff; padding: 12px 22px; border-radius: 999px;
    font-size: 14px; opacity: 0; pointer-events: none;
    transition: all .25s ease; z-index: 60; font-family: inherit;
    max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 520px) {
    .role-grid, .menu-grid { grid-template-columns: 1fr; }
    .hero-title { font-size: 24px; }
    .hero-card { padding: 32px 20px; }
  }
</style>
</head>
<body>

<div id="app"></div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <h3 id="modal-title"></h3>
    <p id="modal-text" class="muted small hidden"></p>
    <input id="modal-input" />
    <div class="modal-actions">
      <button id="modal-cancel" class="btn btn-ghost">انصراف</button>
      <button id="modal-ok" class="btn btn-primary">تایید</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
/* =========================================================
   داده‌های اولیه (برگرفته از data.json)
   ========================================================= */
const STORAGE_KEY = 'carwash_afarineh_v1';

const DEFAULT_DATA = {
  services: ["روشویی", "جارو"],
  vehicles: {
    "تیپ 1": [["پراید", "تیبا"], { "روشویی": 430, "جارو": 120 }],
    "تیپ 2": [["پژو 206", "سمند", "رانا"], { "روشویی": 450, "جارو": 150 }],
    "تیپ 3": [["پژو پارس", "دنا"], { "روشویی": 550, "جارو": 200 }],
    "نیم شاسی": [["x33"], { "روشویی": 650, "جارو": 200 }],
    "شاسی بلند": [["FX", "سانتافه"], { "روشویی": 800, "جارو": 200 }]
  },
  workers: {
    "کارگر 1": { "تعداد": 0, "کارکرد کل": 0, "انعام": 0 },
    "کارگر 2": { "تعداد": 0, "کارکرد کل": 0, "انعام": 0 },
    "کارگر 3": { "تعداد": 0, "کارکرد کل": 0, "انعام": 0 },
    "کارگر 4": { "تعداد": 0, "کارکرد کل": 0, "انعام": 0 },
    "کارگر 5": { "تعداد": 0, "کارکرد کل": 0, "انعام": 0 },
    "کارگر 6": { "تعداد": 0, "کارکرد کل": 0, "انعام": 0 }
  },
  factors: []
};

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return JSON.parse(JSON.stringify(DEFAULT_DATA));
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== 'object' ||
        !parsed.vehicles || !parsed.workers || !Array.isArray(parsed.factors) ||
        !Array.isArray(parsed.services)) {
      return JSON.parse(JSON.stringify(DEFAULT_DATA));
    }
    return parsed;
  } catch (e) {
    return JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
}

/* =========================================================
   State
   ========================================================= */
const state = {
  data: loadData(),
  role: null,            // 'manager' | 'cashier' | null
  managerView: 'menu',   // menu | vehicles | group | prices | priceGroup | workers | worker | factors
  currentGroup: null,
  currentWorker: null,
  cashier: null,
  lastFactor: null
};

function newCashierState() {
  return { step: 1, group: null, vehicle: null, worker: null, services: [], tip: 0 };
}

function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); } catch (e) {}
}

/* =========================================================
   Utilities
   ========================================================= */
const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ESC_MAP[c]);
}

function faNum(n) {
  const num = Number(n);
  if (!isFinite(num)) return '۰';
  try { return num.toLocaleString('fa-IR'); }
  catch (e) { return String(num); }
}

function parseNumber(str) {
  const fa = '۰۱۲۳۴۵۶۷۸۹';
  const ar = '٠١٢٣٤٥٦٧٨٩';
  let s = String(str ?? '');
  s = s.replace(/[۰-۹]/g, ch => String(fa.indexOf(ch)));
  s = s.replace(/[٠-٩]/g, ch => String(ar.indexOf(ch)));
  s = s.replace(/[,٬\s]/g, '');
  return s;
}

function formatDate(iso) {
  if (!iso) return '';
  try {
    return new Date(iso).toLocaleString('fa-IR', { dateStyle: 'short', timeStyle: 'short' });
  } catch (e) { return ''; }
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2300);
}

/* =========================================================
   Modal helpers
   ========================================================= */
const modalEl     = document.getElementById('modal');
const modalTitle  = document.getElementById('modal-title');
const modalText   = document.getElementById('modal-text');
const modalInput  = document.getElementById('modal-input');
const modalOk     = document.getElementById('modal-ok');
const modalCancel = document.getElementById('modal-cancel');

function closeModal() {
  modalEl.classList.add('hidden');
  modalOk.onclick = null;
  modalCancel.onclick = null;
  modalInput.onkeydown = null;
}

function askText(title, defaultValue = '', placeholder = '', numeric = false) {
  return new Promise(resolve => {
    modalTitle.textContent = title;
    modalText.classList.add('hidden');
    modalInput.classList.remove('hidden');
    modalInput.type = 'text';
    modalInput.inputMode = numeric ? 'numeric' : 'text';
    modalInput.value = defaultValue ?? '';
    modalInput.placeholder = placeholder || '';
    modalOk.textContent = 'تایید';
    modalEl.classList.remove('hidden');
    setTimeout(() => { modalInput.focus(); modalInput.select(); }, 60);

    const finish = val => { closeModal(); resolve(val); };
    modalOk.onclick = () => finish(modalInput.value.trim());
    modalCancel.onclick = () => finish(null);
    modalInput.onkeydown = e => {
      if (e.key === 'Enter') { e.preventDefault(); finish(modalInput.value.trim()); }
      else if (e.key === 'Escape') finish(null);
    };
  });
}

function askConfirm(title, text = '') {
  return new Promise(resolve => {
    modalTitle.textContent = title;
    if (text) { modalText.textContent = text; modalText.classList.remove('hidden'); }
    else modalText.classList.add('hidden');
    modalInput.classList.add('hidden');
    modalOk.textContent = 'تایید';
    modalEl.classList.remove('hidden');

    const finish = val => { closeModal(); resolve(val); };
    modalOk.onclick = () => finish(true);
    modalCancel.onclick = () => finish(false);
  });
}

modalEl.addEventListener('click', e => {
  if (e.target === modalEl && modalCancel.onclick) modalCancel.click();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !modalEl.classList.contains('hidden') && modalCancel.onclick) {
    modalCancel.click();
  }
});

/* =========================================================
   Render
   ========================================================= */
const app = document.getElementById('app');

function render() {
  if (state.role === null) renderRoleSelect();
  else if (state.role === 'manager') renderManager();
  else renderCashier();
}

/* ---------- نقش ---------- */
function renderRoleSelect() {
  app.innerHTML = `
    <div class="center-screen">
      <div class="card hero-card">
        <div class="hero-icon">🚿</div>
        <h1 class="hero-title">کارواش آفرینش</h1>
        <p class="muted" style="margin:0">به کارواش آفرینش خوش آمدید.<br>لطفا نقش خود را انتخاب کنید.</p>
        <div class="role-grid">
          <button class="role-btn" data-action="select-role" data-value="manager">
            <span class="role-emoji">🧑‍💼</span>
            <span>مدیریت</span>
          </button>
          <button class="role-btn" data-action="select-role" data-value="cashier">
            <span class="role-emoji">💰</span>
            <span>صندوق‌دار</span>
          </button>
        </div>
      </div>
    </div>
  `;
}

/* ---------- مدیر ---------- */
function renderManager() {
  let inner = '';
  let title = 'پنل مدیریت';
  let back = false;

  switch (state.managerView) {
    case 'menu':
      inner = viewManagerMenu();
      break;
    case 'vehicles':
      title = 'مدیریت خودروها'; back = true; inner = viewVehicles();
      break;
    case 'group':
      title = state.currentGroup || 'گروه خودرو'; back = true; inner = viewGroup();
      break;
    case 'prices':
      title = 'تنظیم تعرفه‌ها'; back = true; inner = viewPrices();
      break;
    case 'priceGroup':
      title = 'تعرفه‌های ' + (state.currentGroup || ''); back = true; inner = viewPriceGroup();
      break;
    case 'workers':
      title = 'فهرست کارگران'; back = true; inner = viewWorkers();
      break;
    case 'worker':
      title = state.currentWorker || 'کارگر'; back = true; inner = viewWorker();
      break;
    case 'factors':
      title = 'فاکتورهای ثبت‌شده'; back = true; inner = viewFactors();
      break;
    default:
      state.managerView = 'menu';
      inner = viewManagerMenu();
  }

  app.innerHTML = `
    <div class="topbar">
      <div class="topbar-title">
        ${back ? `<button class="icon-btn" data-action="m-back" title="بازگشت">→</button>` : ''}
        <h2>${esc(title)}</h2>
      </div>
      <button class="btn btn-ghost btn-sm" data-action="logout">خروج</button>
    </div>
    ${inner}
  `;
}

function viewManagerMenu() {
  const d = state.data;
  const groups   = Object.keys(d.vehicles).length;
  const vehicles = Object.values(d.vehicles).reduce((s, v) => s + v[0].length, 0);
  const workers  = Object.keys(d.workers).length;
  const factors  = d.factors.length;

  return `
    <div class="hero-mini">
      <div class="hero-icon">🚿</div>
      <div>
        <div style="font-weight:700;font-size:18px">کارواش آفرینش</div>
        <div class="muted small">پنل مدیریت</div>
      </div>
    </div>
    <div class="menu-grid">
      <button class="menu-card" data-action="m-vehicles">
        <span class="menu-icon">🚗</span>
        <span class="menu-title">مدیریت خودروها</span>
        <span class="menu-sub">${faNum(groups)} گروه • ${faNum(vehicles)} خودرو</span>
      </button>
      <button class="menu-card" data-action="m-prices">
        <span class="menu-icon">🏷️</span>
        <span class="menu-title">تنظیم تعرفه‌ها</span>
        <span class="menu-sub">قیمت خدمات هر گروه</span>
      </button>
      <button class="menu-card" data-action="m-workers">
        <span class="menu-icon">🧑‍🔧</span>
        <span class="menu-title">فهرست کارگران</span>
        <span class="menu-sub">${faNum(workers)} کارگر</span>
      </button>
      <button class="menu-card" data-action="m-factors">
        <span class="menu-icon">🧾</span>
        <span class="menu-title">فاکتورها</span>
        <span class="menu-sub">${faNum(factors)} فاکتور ثبت‌شده</span>
      </button>
    </div>
  `;
}

function viewVehicles() {
  const d = state.data;
  const groups = Object.keys(d.vehicles);
  return `
    <div class="section-head">
      <h3>گروه‌های خودرو</h3>
      <button class="btn btn-primary btn-sm" data-action="add-group">+ افزودن گروه</button>
    </div>
    ${groups.length ? `<div class="list">
      ${groups.map(g => `
        <div class="list-item clickable" data-action="open-group" data-value="${esc(g)}">
          <div>
            <div class="item-title">${esc(g)}</div>
            <div class="muted small">${faNum(d.vehicles[g][0].length)} خودرو</div>
          </div>
          <button class="icon-btn danger" data-action="remove-group" data-value="${esc(g)}" title="حذف گروه">🗑</button>
        </div>
      `).join('')}
    </div>` : `<div class="empty">هنوز گروهی ثبت نشده است.</div>`}
  `;
}

function viewGroup() {
  const d = state.data;
  const group = state.currentGroup;
  const entry = d.vehicles[group];
  if (!entry) return `<div class="empty">گروه یافت نشد.</div>`;
  const vehicles = entry[0];

  return `
    <div class="section-head">
      <h3>${esc(group)}</h3>
      <button class="btn btn-primary btn-sm" data-action="add-vehicle">+ افزودن خودرو</button>
    </div>
    ${vehicles.length ? `<div class="list">
      ${vehicles.map(v => `
        <div class="list-item">
          <span class="item-title">🚗 ${esc(v)}</span>
          <button class="icon-btn danger" data-action="remove-vehicle" data-value="${esc(v)}" title="حذف">🗑</button>
        </div>
      `).join('')}
    </div>` : `<div class="empty">خودرویی در این گروه ثبت نشده است.</div>`}
  `;
}

function viewPrices() {
  const d = state.data;
  const groups = Object.keys(d.vehicles);
  return `
    <div class="section-head"><h3>گروه خودرو را انتخاب کنید</h3></div>
    ${groups.length ? `<div class="list">
      ${groups.map(g => `
        <div class="list-item clickable" data-action="open-prices" data-value="${esc(g)}">
          <span class="item-title">${esc(g)}</span>
          <span class="chev">‹</span>
        </div>
      `).join('')}
    </div>` : `<div class="empty">گروهی ثبت نشده است.</div>`}
  `;
}

function viewPriceGroup() {
  const d = state.data;
  const group = state.currentGroup;
  const entry = d.vehicles[group];
  if (!entry) return `<div class="empty">گروه یافت نشد.</div>`;
  const prices = entry[1];

  return `
    <div class="section-head"><h3>تعرفه‌های ${esc(group)}</h3></div>
    <div class="list">
      ${d.services.map(s => `
        <div class="list-item clickable" data-action="edit-price" data-value="${esc(s)}">
          <div class="item-title">${esc(s)}</div>
          <div class="price-tag">${faNum(prices[s] || 0)} <span class="muted small">تومان</span></div>
        </div>
      `).join('')}
    </div>
    <p class="muted small" style="margin-top:14px">برای ویرایش هر تعرفه روی آن کلیک کنید.</p>
  `;
}

function viewWorkers() {
  const d = state.data;
  const workers = Object.keys(d.workers);
  return `
    <div class="section-head">
      <h3>کارگران</h3>
      <button class="btn btn-primary btn-sm" data-action="add-worker">+ افزودن کارگر</button>
    </div>
    ${workers.length ? `<div class="list">
      ${workers.map(w => `
        <div class="list-item clickable" data-action="open-worker" data-value="${esc(w)}">
          <div>
            <div class="item-title">🧑‍🔧 ${esc(w)}</div>
            <div class="muted small">${faNum(d.workers[w]['تعداد'])} فاکتور</div>
          </div>
          <div class="row-actions">
            <button class="icon-btn" data-action="edit-worker" data-value="${esc(w)}" title="ویرایش نام">✏️</button>
            <button class="icon-btn danger" data-action="remove-worker" data-value="${esc(w)}" title="حذف">🗑</button>
          </div>
        </div>
      `).join('')}
    </div>` : `<div class="empty">کارگری ثبت نشده است.</div>`}
  `;
}

function viewWorker() {
  const d = state.data;
  const w = d.workers[state.currentWorker];
  if (!w) return `<div class="empty">کارگر یافت نشد.</div>`;
  const stats = [
    ['تعداد فاکتور', faNum(w['تعداد'])],
    ['کارکرد کل', faNum(w['کارکرد کل']) + ' تومان'],
    ['مجموع انعام', faNum(w['انعام']) + ' تومان']
  ];
  return `
    <div class="card" style="padding:24px 20px">
      <div style="font-size:44px;text-align:center;margin-bottom:6px">🧑‍🔧</div>
      <h3 style="text-align:center;margin:0 0 20px">${esc(state.currentWorker)}</h3>
      <div class="stat-grid">
        ${stats.map(([label, val]) => `
          <div class="stat">
            <div class="stat-val">${val}</div>
            <div class="stat-label">${label}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function viewFactors() {
  const d = state.data;
  if (!d.factors.length) return `<div class="empty">فاکتوری ثبت نشده است.</div>`;
  const factors = d.factors.slice().reverse();

  return `
    <div class="section-head"><h3>آخرین فاکتورها</h3></div>
    <div class="list">
      ${factors.map(f => `
        <div class="factor-card">
          <div class="factor-head">
            <span class="badge">${esc(f.group)}</span>
            <span class="muted small">${formatDate(f.date)}</span>
          </div>
          <div class="factor-line"><span class="muted">خودرو:</span> ${esc(f.vehicle)}</div>
          <div class="factor-line"><span class="muted">کارگر:</span> ${esc(f.worker)}</div>
          <div class="factor-line"><span class="muted">خدمات:</span> ${(f.services || []).map(esc).join('، ') || '—'}</div>
          <div class="factor-line"><span class="muted">انعام:</span> ${faNum(f.tip || 0)} تومان</div>
          <div class="factor-total">جمع کل: ${faNum(f.sum || 0)} تومان</div>
        </div>
      `).join('')}
    </div>
  `;
}

/* ---------- صندوق‌دار ---------- */
function renderCashier() {
  const c = state.cashier;
  const d = state.data;

  if (!c) { state.cashier = newCashierState(); return renderCashier(); }
  if (c.step === 5) return renderReceipt();

  let content = '';

  if (c.step === 1) {
    const groups = Object.keys(d.vehicles);
    content = `
      <div class="section-head"><h3>گروه خودرو را انتخاب کنید</h3></div>
      ${groups.length ? `<div class="list">
        ${groups.map(g => `
          <div class="list-item clickable" data-action="c-select-group" data-value="${esc(g)}">
            <span class="item-title">${esc(g)}</span>
            <span class="chev">‹</span>
          </div>
        `).join('')}
      </div>` : `<div class="empty">گروهی ثبت نشده است.</div>`}
    `;
  }

  else if (c.step === 2) {
    const vehicles = (d.vehicles[c.group] || [[], {}])[0] || [];
    content = `
      <div class="section-head"><h3>خودرو را انتخاب کنید</h3></div>
      <div class="crumb muted small">${esc(c.group)}</div>
      ${vehicles.length ? `<div class="list">
        ${vehicles.map(v => `
          <div class="list-item clickable" data-action="c-select-vehicle" data-value="${esc(v)}">
            <span class="item-title">🚗 ${esc(v)}</span>
            <span class="chev">‹</span>
          </div>
        `).join('')}
      </div>` : `<div class="empty">خودرویی ثبت نشده است.</div>`}
      <button class="btn btn-ghost" style="margin-top:16px" data-action="c-back">→ بازگشت</button>
    `;
  }

  else if (c.step === 3) {
    const workers = Object.keys(d.workers);
    content = `
      <div class="section-head"><h3>کارگر را انتخاب کنید</h3></div>
      <div class="crumb muted small">${esc(c.group)} • ${esc(c.vehicle)}</div>
      ${workers.length ? `<div class="list">
        ${workers.map(w => `
          <div class="list-item clickable" data-action="c-select-worker" data-value="${esc(w)}">
            <span class="item-title">🧑‍🔧 ${esc(w)}</span>
            <span class="chev">‹</span>
          </div>
        `).join('')}
      </div>` : `<div class="empty">کارگری ثبت نشده است.</div>`}
      <button class="btn btn-ghost" style="margin-top:16px" data-action="c-back">→ بازگشت</button>
    `;
  }

  else if (c.step === 4) {
    const prices = (d.vehicles[c.group] || [[], {}])[1] || {};
    const servicesTotal = c.services.reduce((s, x) => s + (prices[x] || 0), 0);
    const total = servicesTotal + (c.tip || 0);

    content = `
      <div class="section-head"><h3>خدمات را انتخاب کنید</h3></div>
      <div class="crumb muted small">${esc(c.group)} • ${esc(c.vehicle)} • ${esc(c.worker)}</div>

      <div class="chips">
        ${d.services.map(s => `
          <button class="chip ${c.services.includes(s) ? 'selected' : ''}"
                  data-action="c-toggle-service" data-value="${esc(s)}">
            ${c.services.includes(s) ? '✓ ' : ''}${esc(s)}
            <span class="chip-price">${faNum(prices[s] || 0)}</span>
          </button>
        `).join('')}
      </div>

      <div class="tip-row">
        <span>💰 مبلغ انعام</span>
        <button class="btn btn-ghost btn-sm" data-action="c-tip">${faNum(c.tip || 0)} تومان ✏️</button>
      </div>

      <div class="summary">
        <div class="summary-row"><span>جمع خدمات</span><span>${faNum(servicesTotal)} تومان</span></div>
        <div class="summary-row"><span>انعام</span><span>${faNum(c.tip || 0)} تومان</span></div>
        <div class="summary-row total"><span>مبلغ قابل پرداخت</span><span>${faNum(total)} تومان</span></div>
      </div>

      <div class="actions-row">
        <button class="btn btn-ghost" data-action="c-back">→ بازگشت</button>
        <button class="btn btn-primary" data-action="c-submit" ${c.services.length ? '' : 'disabled'}>✅ ثبت نهایی</button>
      </div>
    `;
  }

  const stepBar = `
    <div class="steps">
      ${[1,2,3,4].map(i =>
        `<div class="step-dot ${i < c.step ? 'done' : ''} ${i === c.step ? 'active' : ''}"></div>`
      ).join('')}
    </div>
  `;

  app.innerHTML = `
    <div class="topbar">
      <h2>ثبت فاکتور جدید</h2>
      <button class="btn btn-ghost btn-sm" data-action="logout">خروج</button>
    </div>
    ${stepBar}
    ${content}
  `;
}

function renderReceipt() {
  const f = state.lastFactor;
  if (!f) { state.cashier = newCashierState(); return render(); }

  app.innerHTML = `
    <div class="topbar">
      <h2>فاکتور ثبت شد</h2>
      <button class="btn btn-ghost btn-sm" data-action="logout">خروج</button>
    </div>

    <div class="card receipt">
      <div class="success-icon">✅</div>
      <p class="receipt-sub">فاکتور با موفقیت ثبت شد.</p>
      <div class="receipt-row"><span>گروه</span><span>${esc(f.group)}</span></div>
      <div class="receipt-row"><span>خودرو</span><span>${esc(f.vehicle)}</span></div>
      <div class="receipt-row"><span>کارگر</span><span>${esc(f.worker)}</span></div>
      <div class="receipt-row"><span>خدمات</span><span>${(f.services || []).map(esc).join('، ') || '—'}</span></div>
      <div class="receipt-row"><span>انعام</span><span>${faNum(f.tip || 0)} تومان</span></div>
      <div class="receipt-row total"><span>جمع کل</span><span>${faNum(f.sum || 0)} تومان</span></div>
    </div>

    <button class="btn btn-primary"
            style="width:100%;justify-content:center;margin-top:16px"
            data-action="c-new-factor">ثبت فاکتور جدید</button>
  `;
}

/* =========================================================
   Actions
   ========================================================= */
function managerBack() {
  const map = {
    vehicles: 'menu',
    group: 'vehicles',
    prices: 'menu',
    priceGroup: 'prices',
    workers: 'menu',
    worker: 'workers',
    factors: 'menu'
  };
  state.managerView = map[state.managerView] || 'menu';
  state.currentGroup = null;
  state.currentWorker = null;
}

async function handleAction(action, value) {
  const d = state.data;

  switch (action) {

    /* ---------- عمومی ---------- */
    case 'select-role':
      state.role = value;
      state.lastFactor = null;
      if (value === 'manager') { state.managerView = 'menu'; }
      else { state.cashier = newCashierState(); }
      render();
      return;

    case 'logout':
      state.role = null;
      state.cashier = null;
      state.lastFactor = null;
      state.managerView = 'menu';
      render();
      return;

    /* ---------- ناوبری مدیر ---------- */
    case 'm-vehicles': state.managerView = 'vehicles'; render(); return;
    case 'm-prices':   state.managerView = 'prices';   render(); return;
    case 'm-workers':  state.managerView = 'workers';  render(); return;
    case 'm-factors':  state.managerView = 'factors';  render(); return;
    case 'm-back':     managerBack(); render(); return;

    /* ---------- گروه خودرو ---------- */
    case 'open-group':
      state.currentGroup = value;
      state.managerView = 'group';
      render();
      return;

    case 'add-group': {
      const name = await askText('نام گروه خودرو را وارد کنید:', '', 'مثلا تیپ ۴');
      if (!name) return;
      if (d.vehicles[name]) { toast('این گروه از قبل وجود دارد.'); return; }
      const prices = {};
      d.services.forEach(s => prices[s] = 0);
      d.vehicles[name] = [[], prices];
      saveData(); render(); toast('گروه با موفقیت ساخته شد.');
      return;
    }

    case 'remove-group': {
      const ok = await askConfirm(`حذف گروه «${value}»`, 'آیا از حذف این گروه مطمئن هستید؟');
      if (!ok) return;
      delete d.vehicles[value];
      saveData(); render(); toast('گروه حذف شد.');
      return;
    }

    /* ---------- خودرو ---------- */
    case 'add-vehicle': {
      if (!state.currentGroup) return;
      const name = await askText('نام خودرو را وارد کنید:');
      if (!name) return;
      const list = d.vehicles[state.currentGroup][0];
      if (list.includes(name)) { toast('این خودرو از قبل در این گروه است.'); return; }
      list.push(name);
      saveData(); render(); toast('خودرو اضافه شد.');
      return;
    }

    case 'remove-vehicle': {
      const ok = await askConfirm(`حذف خودرو «${value}»`, 'آیا مطمئن هستید؟');
      if (!ok) return;
      const list = d.vehicles[state.currentGroup][0];
      const i = list.indexOf(value);
      if (i > -1) list.splice(i, 1);
      saveData(); render(); toast('خودرو حذف شد.');
      return;
    }

    /* ---------- تعرفه‌ها ---------- */
    case 'open-prices':
      state.currentGroup = value;
      state.managerView = 'priceGroup';
      render();
      return;

    case 'edit-price': {
      const group = state.currentGroup;
      const service = value;
      if (!d.vehicles[group]) return;
      const cur = d.vehicles[group][1][service] || 0;
      const input = await askText(
        `تعرفه «${service}» در گروه «${group}» را وارد کنید:`,
        String(cur), 'عدد', true
      );
      if (input === null) return;
      const num = Number(parseNumber(input));
      if (!Number.isInteger(num) || num < 0) { toast('لطفا یک عدد صحیح وارد کنید.'); return; }
      d.vehicles[group][1][service] = num;
      saveData(); render(); toast('تعرفه ثبت شد.');
      return;
    }

    /* ---------- کارگران ---------- */
    case 'open-worker':
      state.currentWorker = value;
      state.managerView = 'worker';
      render();
      return;

    case 'add-worker': {
      const name = await askText('نام کارگر را وارد کنید:');
      if (!name) return;
      if (d.workers[name]) { toast('این کارگر از قبل وجود دارد.'); return; }
      d.workers[name] = { 'تعداد': 0, 'کارکرد کل': 0, 'انعام': 0 };
      saveData(); render(); toast('کارگر اضافه شد.');
      return;
    }

    case 'edit-worker': {
      const oldName = value;
      const newName = await askText(`نام جدید کارگر «${oldName}» را وارد کنید:`, oldName);
      if (!newName || newName === oldName) return;
      if (d.workers[newName]) { toast('این نام از قبل وجود دارد.'); return; }
      const rebuilt = {};
      Object.keys(d.workers).forEach(k => {
        rebuilt[k === oldName ? newName : k] = d.workers[k];
      });
      d.workers = rebuilt;
      saveData(); render(); toast('نام کارگر ویرایش شد.');
      return;
    }

    case 'remove-worker': {
      const ok = await askConfirm(`حذف کارگر «${value}»`, 'آیا مطمئن هستید؟');
      if (!ok) return;
      delete d.workers[value];
      saveData(); render(); toast('کارگر حذف شد.');
      return;
    }

    /* ---------- صندوق‌دار ---------- */
    case 'c-select-group':
      state.cashier.group = value;
      state.cashier.step = 2;
      render();
      return;

    case 'c-select-vehicle':
      state.cashier.vehicle = value;
      state.cashier.step = 3;
      render();
      return;

    case 'c-select-worker':
      state.cashier.worker = value;
      state.cashier.step = 4;
      render();
      return;

    case 'c-back': {
      const c = state.cashier;
      if (c.step === 1) { state.role = null; }
      else if (c.step === 2) { c.step = 1; c.group = null; }
      else if (c.step === 3) { c.step = 2; c.vehicle = null; }
      else if (c.step === 4) { c.step = 3; c.worker = null; c.services = []; c.tip = 0; }
      render();
      return;
    }

    case 'c-toggle-service': {
      const c = state.cashier;
      const i = c.services.indexOf(value);
      if (i > -1) c.services.splice(i, 1);
      else c.services.push(value);
      render();
      return;
    }

    case 'c-tip': {
      const input = await askText('مبلغ انعام را وارد کنید:', String(state.cashier.tip || 0), 'عدد', true);
      if (input === null) return;
      const num = Number(parseNumber(input));
      if (!Number.isInteger(num) || num < 0) { toast('لطفا یک عدد صحیح وارد کنید.'); return; }
      state.cashier.tip = num;
      render();
      return;
    }

    case 'c-submit': {
      const c = state.cashier;
      if (!c.services.length) { toast('حداقل یک خدمت انتخاب کنید.'); return; }

      const prices = (d.vehicles[c.group] || [[], {}])[1] || {};
      const sum = c.services.reduce((s, x) => s + (prices[x] || 0), 0) + (c.tip || 0);

      const factor = {
        group: c.group,
        vehicle: c.vehicle,
        worker: c.worker,
        services: [...c.services],
        tip: c.tip || 0,
        sum: sum,
        date: new Date().toISOString()
      };

      d.factors.push(factor);

      const w = d.workers[c.worker];
      if (w) {
        w['تعداد'] = (w['تعداد'] || 0) + 1;
        w['کارکرد کل'] = (w['کارکرد کل'] || 0) + sum;
        w['انعام'] = (w['انعام'] || 0) + (c.tip || 0);
      }

      saveData();
      state.lastFactor = factor;
      state.cashier = newCashierState();
      state.cashier.step = 5;
      render();
      return;
    }

    case 'c-new-factor':
      state.cashier = newCashierState();
      state.lastFactor = null;
      render();
      return;

    default:
      return;
  }
}

/* =========================================================
   Event delegation
   ========================================================= */
app.addEventListener('click', async e => {
  const el = e.target.closest('[data-action]');
  if (!el || !app.contains(el)) return;
  const action = el.dataset.action;
  const value = el.dataset.value;
  try {
    await handleAction(action, value);
  } catch (err) {
    console.error(err);
    toast('خطایی رخ داد.');
  }
});

/* =========================================================
   Start
   ========================================================= */
render();
</script>

</html>
